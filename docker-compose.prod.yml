# SPBIM · ambiente de produção do piloto (SP-501).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# O TLS **não** termina aqui. Coloque um proxy de borda (Caddy, ALB, Cloudflare)
# na frente da porta 80 do serviço `web` — ver docs/OPERACAO.md.

name: spbim-prod

x-comum: &comum
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "20m", max-file: "5" }

services:
  db:
    <<: *comum
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # pt_BR não vem na imagem alpine; a ordenação do domínio é ASCII.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # Sem `ports`: o banco só é alcançável pela rede interna do compose.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *comum
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    <<: *comum
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10

  # Roda as migrations e sai. `api` e `worker` só sobem depois que este
  # terminar bem — evita worker escrevendo em schema velho durante o deploy.
  migracao:
    image: ${IMAGEM_API:-spbim/api:latest}
    build: { context: ./backend }
    env_file: [.env.prod]
    environment:
      POSTGRES_HOST: db
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  api:
    <<: *comum
    image: ${IMAGEM_API:-spbim/api:latest}
    build: { context: ./backend }
    env_file: [.env.prod]
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
      migracao: { condition: service_completed_successfully }

  worker:
    <<: *comum
    image: ${IMAGEM_API:-spbim/api:latest}
    build: { context: ./backend }
    env_file: [.env.prod]
    environment:
      APP_ENV: prod
      APP_DEBUG: "false"
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
      S3_ENDPOINT_URL: http://minio:9000
    # `--concurrency 2`: abrir um IFC grande é caro em memória, e o gargalo do
    # piloto é RAM, não CPU. `--max-tasks-child` recicla o processo para o
    # IfcOpenShell não acumular memória entre modelos.
    command:
      - celery
      - -A
      - app.workers.celery_app.celery
      - worker
      - -l
      - info
      - --concurrency
      - "2"
      - --max-tasks-per-child
      - "20"
    depends_on:
      api: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app.celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 60s
      timeout: 20s
      retries: 3

  web:
    <<: *comum
    image: ${IMAGEM_WEB:-spbim/web:latest}
    build: { context: ./frontend }
    environment:
      # No compose o serviço se chama `api`. Em outras plataformas o nome do
      # host muda — ver docs/EASYPANEL.md.
      API_UPSTREAM: ${API_UPSTREAM:-http://api:8000}
    ports:
      - "${PORTA_HTTP:-8080}:80"
    depends_on:
      api: { condition: service_started }

  # --- backup (SP-501) --------------------------------------------------
  # Dois serviços, e não um: o dump do banco precisa do `pg_dump` (imagem do
  # Postgres) e a cópia do bucket precisa do `mc` (imagem do MinIO). Juntar os
  # dois numa imagem só significaria instalar um deles à mão a cada build.

  backup-db:
    <<: *comum
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/backup/agendador.sh", "/backup/backup-db.sh"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_HORA: ${BACKUP_HORA:-03}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-30}
      BACKUP_DIR: /var/backups/spbim
    volumes:
      - ./infra/backup:/backup:ro
      - backups:/var/backups/spbim
    depends_on:
      db: { condition: service_healthy }

  backup-s3:
    <<: *comum
    image: minio/mc:latest
    entrypoint: ["/bin/sh", "/backup/agendador.sh", "/backup/backup-s3.sh"]
    environment:
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      # Uma hora depois do banco: assim o espelho do bucket nunca fica mais
      # antigo que o dump que o referencia.
      BACKUP_HORA: ${BACKUP_HORA_S3:-04}
      BACKUP_DIR: /var/backups/spbim
    volumes:
      - ./infra/backup:/backup:ro
      - backups:/var/backups/spbim
    depends_on:
      minio: { condition: service_healthy }

volumes:
  db_data:
  redis_data:
  minio_data:
  backups:
