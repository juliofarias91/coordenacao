<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPQ11 · Central de Auditoria BIM</title>
<style>
  :root{
    --canvas:#EEF1F5;--panel:#FFFFFF;--panel-2:#F6F8FB;
    --ink:#171B22;--ink-2:#586071;--ink-3:#8E97A6;
    --line:#E1E6EE;--line-2:#CED6E2;
    --accent:#2547B0;--accent-soft:#E8EDFB;
    --ok:#127A52;--ok-bg:#E4F3EC;--bad:#B5322F;--bad-bg:#FBE9E7;
    --wait:#9A6410;--wait-bg:#FBF0DC;--na:#8E97A6;--na-bg:#EEF1F5;
    --purple:#6A3DAE;--purple-bg:#F0E9FB;
    --macro-A:#2547B0;--macro-C:#A85B12;--macro-M:#0E7C6B;--macro-S:#6A3DAE;
    --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
    --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5}
  button,input,textarea,select{font-family:inherit}
  button{cursor:pointer}
  .app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
  aside{background:#131722;color:#C4CCDA;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px}
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid #232A38;margin-bottom:12px}
  .brand .mk{width:26px;height:26px;border-radius:6px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px;font-family:var(--mono)}
  .brand b{color:#fff;font-size:14px;font-weight:600}
  .brand span{display:block;color:#7C879A;font-size:11px;font-weight:500}
  nav{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  nav button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:none;border:none;color:#AEB8C8;padding:9px 10px;border-radius:7px;font-size:13.5px;font-weight:500}
  nav button:hover{background:#1D2431;color:#EAF0F8}
  nav button.on{background:var(--accent);color:#fff}
  nav .ic{width:16px;height:16px;flex:none;opacity:.9}
  .side-foot{margin-top:auto;padding-top:12px;border-top:1px solid #232A38}
  .langsw{display:inline-flex;background:#1D2431;border-radius:7px;padding:3px;margin-bottom:10px}
  .langsw button{border:none;background:none;color:#8894A6;font-size:12px;font-weight:600;padding:4px 12px;border-radius:5px}
  .langsw button.on{background:var(--accent);color:#fff}
  .foot-t{color:#6C7789;font-size:11px;line-height:1.6}
  main{padding:26px 30px 70px;max-width:1180px}
  .top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .top h1{font-size:21px;font-weight:650;letter-spacing:-.2px}
  .top .sub{color:var(--ink-2);font-size:13px;margin-top:3px;max-width:660px}
  .crumb{color:var(--ink-3);font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .crumb a{color:var(--accent);text-decoration:none;font-weight:500;cursor:pointer}
  .metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .metric{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:14px 16px}
  .metric .lb{color:var(--ink-2);font-size:12.5px;font-weight:500}
  .metric .vl{font-size:26px;font-weight:660;letter-spacing:-.5px;margin-top:5px}
  .metric .vl small{font-size:14px;font-weight:500;color:var(--ink-3)}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line-2);border-radius:9px;padding:3px;margin-bottom:16px;flex-wrap:wrap}
  .seg button{border:none;background:none;padding:7px 15px;border-radius:6px;font-size:13px;font-weight:600;color:var(--ink-2)}
  .seg button.on{background:var(--accent);color:#fff}
  .filters{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .chip{border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:500}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .filters .sp{flex:1}
  input.search,input.f,textarea.f,select.f{border:1px solid var(--line-2);border-radius:8px;padding:8px 12px;font-size:13px;background:var(--panel);color:var(--ink)}
  input.search{width:220px;font-family:var(--mono)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea.f{width:100%;resize:vertical;min-height:60px;line-height:1.5}
  .f{width:100%}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-3);padding:11px 16px;background:var(--panel-2);border-bottom:1px solid var(--line)}
  thead th.c{text-align:center}
  tbody tr{border-bottom:1px solid var(--line)}
  tbody tr.clk{cursor:pointer}
  tbody tr:last-child{border-bottom:none}
  tbody tr.clk:hover{background:var(--panel-2)}
  td{padding:12px 16px;vertical-align:middle}
  .mcell{display:flex;align-items:center;gap:11px}
  .macro{width:3px;height:30px;border-radius:2px;flex:none}
  .code{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:-.2px}
  .mmeta{font-size:11.5px;color:var(--ink-3);margin-top:1px}
  .co{color:var(--ink-2);font-size:13px}
  .ver{font-family:var(--mono);font-size:12.5px;color:var(--ink-2);text-align:center}
  .appro{display:flex;align-items:center;gap:9px;min-width:130px}
  .track{flex:1;height:6px;background:var(--na-bg);border-radius:20px;overflow:hidden}
  .fill{height:100%;border-radius:20px}
  .pctn{font-family:var(--mono);font-size:12.5px;font-weight:600;min-width:38px;text-align:right}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:20px;white-space:nowrap}
  .pill.pub{background:var(--ok-bg);color:var(--ok)}
  .pill.out{background:var(--wait-bg);color:var(--wait)}
  .pill.np{background:var(--na-bg);color:var(--na)}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .mx td.cell{text-align:center;padding:8px 6px}
  .mx .cellpct{display:inline-block;min-width:44px;padding:3px 0;border-radius:20px;font-family:var(--mono);font-size:12px;font-weight:600}
  .dhead{display:flex;align-items:center;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .dhead .hcode{font-family:var(--mono);font-size:18px;font-weight:670;letter-spacing:-.4px}
  .dhead .hmeta{color:var(--ink-2);font-size:13px;margin-top:4px;display:flex;gap:14px;flex-wrap:wrap}
  .dhead .hmeta b{color:var(--ink);font-weight:600}
  .dhead .rightinfo{margin-left:auto;text-align:right;font-size:12px;color:var(--ink-3)}
  .path{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:2px;flex-wrap:wrap}
  .tab{background:none;border:none;padding:10px 15px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--accent);border-bottom-color:var(--accent)}
  .tab .n{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:5px;font-weight:600}
  .clhead{display:flex;align-items:center;justify-content:space-between;padding:14px 4px 12px;gap:10px;flex-wrap:wrap}
  .clhead .t{font-size:12.5px;color:var(--ink-2)}
  .clhead .t b{color:var(--ink)}
  .grp{font-size:11.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);background:var(--panel-2);padding:7px 16px;border-bottom:1px solid var(--line)}
  .item{border-bottom:1px solid var(--line)}
  .item:last-child{border-bottom:none}
  .irow{display:flex;align-items:center;gap:14px;padding:12px 16px}
  .irow .chev{color:var(--ink-3);font-size:10px;width:12px;transition:transform .15s}
  .irow.op .chev{transform:rotate(90deg)}
  .irow .txt{flex:1;min-width:0;cursor:pointer}
  .irow .nm{font-size:13.5px;font-weight:550}
  .irow .in{font-size:12px;color:var(--ink-2);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .flag{font-size:10px;font-weight:600;color:var(--bad);margin-left:7px}
  .auto{font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:2px 7px;border-radius:5px;text-transform:uppercase}
  .auto.a{background:var(--accent-soft);color:var(--accent)}
  .auto.m{background:var(--na-bg);color:var(--na)}
  .auto.d{background:var(--purple-bg);color:var(--purple)}
  .setp{border:1px solid var(--line-2);background:var(--panel);border-radius:20px;font-size:12px;font-weight:600;padding:4px 12px;min-width:104px;text-align:center}
  .setp.ok{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
  .setp.bad{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
  .setp.wait{background:var(--wait-bg);border-color:transparent;color:var(--wait)}
  .setp.na{background:var(--na-bg);border-color:transparent;color:var(--na)}
  .expand{padding:2px 16px 16px 42px;background:var(--panel-2);border-top:1px solid var(--line)}
  .exlabel{font-size:11.5px;font-weight:600;color:var(--ink-2);margin:12px 0 5px}
  .ev{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:4px}
  .evchip{font-family:var(--mono);font-size:11px;background:var(--panel);border:1px solid var(--line-2);border-radius:6px;padding:3px 8px;color:var(--ink-2)}
  .btn{border:1px solid var(--line-2);background:var(--panel);border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.pri:hover{background:#1d3a92;color:#fff}
  .btn.danger{background:var(--bad-bg);border-color:transparent;color:var(--bad)}
  .btn.danger:hover{color:var(--bad)}
  .btn.sm{padding:5px 10px;font-size:12px}
  .ids{font-family:var(--mono);font-size:11px;color:var(--bad);background:var(--bad-bg);padding:2px 8px;border-radius:5px}
  .sectitle{font-size:15px;font-weight:640;margin:26px 0 12px;display:flex;align-items:center;gap:9px}
  .badge{background:var(--bad-bg);color:var(--bad);font-size:12px;font-weight:700;border-radius:20px;padding:1px 9px}
  .nc{border:1px solid var(--line);border-radius:11px;padding:14px 16px;margin-bottom:10px;background:var(--panel)}
  .nc .nchead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .nc .ncname{font-weight:600;font-size:13.5px}
  .nc .ncsub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
  .nc .ncbody{margin-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
  .nc .full{grid-column:1/-1}
  .lab{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
  .empty{padding:36px 20px;text-align:center;color:var(--ink-3);font-size:13px}
  .empty b{display:block;color:var(--ink-2);font-size:14px;margin-bottom:4px}
  .hint{font-size:11.5px;color:var(--ink-3);margin:10px 4px 0;line-height:1.6}
  .libitem{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--line)}
  .libitem:last-child{border-bottom:none}
  .libitem .lcode{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:130px;flex:none;overflow:hidden;text-overflow:ellipsis}
  .libitem .lname{flex:1;min-width:0}
  .libitem .lname b{font-size:13.5px;font-weight:600}
  .libitem .lname span{font-size:11.5px;color:var(--ink-3);display:block}
  .used{font-size:11px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:20px;padding:3px 9px;white-space:nowrap}
  .editor{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:18px 20px;margin-bottom:16px}
  .editor h3{font-size:14px;font-weight:640;margin-bottom:14px}
  .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px;margin-bottom:12px}
  .frow .full{grid-column:1/-1}
  .editor .fl{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;display:block}
  .eact{display:flex;gap:8px;margin-top:6px}
  @media(max-width:820px){.app{grid-template-columns:1fr}aside{display:none}.metrics{grid-template-columns:repeat(2,1fr)}main{padding:18px}.nc .ncbody,.frow{grid-template-columns:1fr}}  @media print{aside,.top,.filters,.hint,.no-print,.crumb{display:none!important}main{padding:0;max-width:none}#report{border:none}}
  .loginwrap{min-height:100vh;display:none;align-items:center;justify-content:center;background:var(--canvas);padding:20px}
  .logincard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:30px 30px 26px;width:100%;max-width:380px}
  .loginlogo{font-weight:800;letter-spacing:2px;font-size:22px;color:var(--accent)}
  .logintitle{font-size:16px;font-weight:640;margin-top:10px}
  .loginsub{font-size:13px;color:var(--ink-2);margin:2px 0 20px}
  .logincard label{font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.3px;margin-bottom:5px;display:block}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(18px);background:#1b2130;color:#fff;padding:11px 20px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:0 10px 34px rgba(0,0,0,.28);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:2000}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .card,.metric,.dhead,.editor{box-shadow:0 1px 2px rgba(23,27,34,.05)}
  .btn,nav button,.chip,.seg button,.tab,tbody tr.clk,.libitem{transition:background .14s,border-color .14s,color .14s,box-shadow .14s}
  .loginwrap{background:linear-gradient(160deg,#EFF2F6,#E1E7F0)}
  html[data-theme="dark"]{
    --canvas:#0E1420;--panel:#161C28;--panel-2:#1B2230;
    --ink:#E6EAF1;--ink-2:#A3ADBE;--ink-3:#6E7A8C;
    --line:#26303F;--line-2:#33404F;
    --accent:#6E8CF2;--accent-soft:#1E2A45;
    --ok:#3FBE86;--ok-bg:#16281F;--bad:#E8736E;--bad-bg:#2E1B1B;
    --wait:#D9A441;--wait-bg:#2C2416;--na:#8894A6;--na-bg:#1E2531;
    --purple:#A98CE0;--purple-bg:#241C36;
  }
  html[data-theme="dark"] .loginwrap{background:linear-gradient(160deg,#0E1420,#141E2E)}
  html[data-theme="dark"] .card,html[data-theme="dark"] .metric,html[data-theme="dark"] .dhead,html[data-theme="dark"] .editor{box-shadow:none}
  @media print{html,html[data-theme="dark"]{--canvas:#fff;--panel:#fff;--panel-2:#fff;--ink:#000;--ink-2:#333;--ink-3:#666;--line:#ccc;--line-2:#bbb}body{background:#fff}}
  #confirm{position:fixed;inset:0;background:rgba(10,16,26,.5);display:none;align-items:center;justify-content:center;z-index:3000;padding:20px}
  #confirm.show{display:flex}
  .cfm-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:360px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .cfm-msg{font-size:14px;color:var(--ink);margin-bottom:18px;line-height:1.5}
  .cfm-act{display:flex;gap:8px;justify-content:flex-end}
  .mobilebar{display:none}
  .mobilebar b{color:#fff;font-weight:800;letter-spacing:1px;font-size:14px;flex:none;margin-right:2px}
  .mobilebar button{background:#1D2431;border:none;color:#C4CCDA;padding:7px 11px;border-radius:7px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none;cursor:pointer}
  .mobilebar button.on{background:var(--accent);color:#fff}
  @media(max-width:820px){.mobilebar{display:flex;align-items:center;gap:6px;background:#131722;padding:10px 12px;position:sticky;top:0;z-index:50;overflow-x:auto}}
</style>
</head>
<body>
<header class="mobilebar" id="mobilebar"></header>
<div class="app">
  <aside>
    <div class="brand"><div class="mk" id="logomk">SP</div><div style="flex:1;min-width:0"><b id="brandT"></b><span id="brandS"></span></div><button id="bell" onclick="go('notif')" style="background:none;border:none;color:#AEB8C8;cursor:pointer;position:relative;padding:4px;flex:none"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg><span id="bellBadge"></span></button></div>
    <nav id="nav"></nav>
    <div class="side-foot">
      <div id="userbox"></div>
      <div style="display:flex;gap:8px;margin-bottom:10px"><div class="langsw" id="langsw"></div><div class="langsw" id="themesw"></div></div>
      <div class="foot-t" id="footT"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="login" class="loginwrap"></div>
<div id="clientapp" style="display:none"></div>
<div id="picker" style="display:none;min-height:100vh"></div>
<script>
/* ===== idioma ===== */
function loadLang(){try{const v=localStorage.getItem('cpq_lang');if(v==='pt'||v==='en')return v;}catch(e){}return 'pt';}
let LANG=loadLang();
function L(pt,en){return LANG==='pt'?pt:en;}
function setLang(l){LANG=l;try{localStorage.setItem('cpq_lang',l);}catch(e){}boot();}
function loadTheme(){try{const v=localStorage.getItem('cpq_theme');if(v==='dark'||v==='light')return v;}catch(e){}return 'light';}
let THEME=loadTheme();
function applyTheme(){document.documentElement.setAttribute('data-theme',THEME);}
function setTheme(t){THEME=t;try{localStorage.setItem('cpq_theme',t);}catch(e){}applyTheme();boot();}

const MACRO={A:{c:'var(--macro-A)',t:'ARCH'},C:{c:'var(--macro-C)',t:'CIVIL/STRUCT'},M:{c:'var(--macro-M)',t:'MEP'},S:{c:'var(--macro-S)',t:'SITE'}};
const COLORS={A:'#2547B0',C:'#A85B12',M:'#0E7C6B',S:'#6A3DAE'};
const macroColor=k=>COLORS[k]||'#8E97A6';
const AREAS=[['ADMIN','ADMN'],['COLO1','COLO1'],['COLO2','COLO2'],['COLO3','COLO3'],['SITE','SITE'],['UTLS','UTLS']];
const CYCLE=['ok','bad','wait','na'];
function slabel(s){return {ok:L('Aprovado','Approved'),bad:L('Reprovado','Rejected'),wait:L('Pendente','Pending'),na:'N/A'}[s];}
function autotxt(a){return {a:'Auto',m:L('Manual','Manual'),d:L('Design Auto','Design Auto')}[a];}
function rolelabel(r){return {trade:L('Instaladora','Installer'),bim:L('Modeladora','Modeler'),fornecedor:L('Fornecedor','Supplier'),coordenacao:L('Coordenação','Coordination')}[r];}
const TAB_LABEL=()=>({avanco:L('Avanço','Progress'),geral:L('Geral','General'),ifc:'IFC',['4d']:L('4D Parâmetros','4D Parameters'),lod400:'LOD 400',lod500:'LOD 500'});

let CRITERIA=[
  {id:'MODEL_NAME',cat:'Aspectos gerais',pt:'Nome do modelo',en:'Model name',tipo:'modelo',auto:'a',std:'Nomenclatura',instr:'Verificar se o nome do arquivo está correto.'},
  {id:'START_VIEW',cat:'Aspectos gerais',pt:'Vista inicial',en:'Start up view',tipo:'modelo',auto:'m',std:'BEP',instr:'Info do projeto e tabela de revisões preenchidas.'},
  {id:'SHARED_COORD',cat:'Aspectos gerais',pt:'Coordenadas compartilhadas',en:'Shared coordinates',tipo:'modelo',auto:'a',std:'Construction BIM',instr:'Ponto base nos eixos A/0.01; conferir com Construction BIM.'},

function rnd(s){return (s*1103515245+12345)&0x7fffffff;}
const STATE={};

  const st={status:{},notes:{},ncs:[],areas:{}};
  Object.keys(CHECKLISTS).forEach(key=>{st.status[key]={};st.notes[key]={};let s=m.id*17+key.length*7;
    CHECKLISTS[key].ids.forEach(cid=>{s=rnd(s);const r=s%100;st.status[key][cid]=m.st==='np'?'wait':(r<70?'ok':r<86?'bad':r<95?'wait':'na');});});
  let s=m.id*31;AREAS.forEach(([a])=>{s=rnd(s);const r=s%100;st.areas[a]=m.st==='np'?'np':(r<40?'na':Math.max(1,Math.min(100,s%100)));});
  const base=m.st==='np'?null:pct(st.status.geral,CHECKLISTS.geral.ids);
  st.rounds=[];
  if(m.st!=='np'){const dates=['mai/25','jun/25','jul/25','ago/25','set/25','out/25','nov/25'];const n=3+(m.id%3);let sr=m.id*13;
    for(let r=1;r<=n;r++){sr=rnd(sr);const appr=r===n?(base||60):Math.max(15,Math.min(100,Math.round((base||60)-(n-r)*(7+sr%7))));
      st.rounds.push({r,ver:'V'+r,appr,date:dates[r-1]||('R'+r),met:2+sr%6,exc:sr%3,neu:sr%4});}}
  STATE[m.id]=st;
});

function pct(map,ids){const v=ids.map(i=>map[i]).filter(x=>x&&x!=='na');if(!v.length)return null;return Math.round(100*v.filter(x=>x==='ok').length/v.length);}

/* ===== avanço / rounds ===== */
function chartSVG(rounds){
  if(!rounds.length)return `<div class="empty">${L('Sem rounds publicados.','No published rounds.')}</div>`;
  const W=640,H=175,pad=34;const ph=H-pad-24,pw=W-pad-16,n=rounds.length;
  const x=i=>pad+(n===1?pw/2:pw*i/(n-1)),y=v=>pad+ph*(1-v/100);
  const pts=rounds.map((r,i)=>[x(i),y(r.appr)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const area=`M${pts[0][0]} ${y(0)} `+pts.map(p=>'L'+p[0]+' '+p[1]).join(' ')+` L${pts[n-1][0]} ${y(0)} Z`;
  const grid=[0,50,90,100].map(v=>`<line x1="${pad}" y1="${y(v)}" x2="${W-8}" y2="${y(v)}" stroke="var(--line)" stroke-width="0.5" ${v===90?'stroke-dasharray="4 4"':''}/><text x="${pad-6}" y="${y(v)+3}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">${v}</text>`).join('');
  const dots=rounds.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.appr)}" r="4" fill="${pctColor(r.appr)}"/><text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="var(--mono)">R${r.r}</text><text x="${x(i)}" y="${y(r.appr)-9}" text-anchor="middle" font-size="10" font-weight="700" fill="${pctColor(r.appr)}" font-family="var(--mono)">${r.appr}%</text>`).join('');
  return `<svg width="100%" viewBox="0 0 ${W} ${H}" style="display:block">${grid}<path d="${area}" fill="var(--accent-soft)" opacity="0.5"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${dots}</svg>`;
}
function avancoBody(m){
  const dsc=discOf(m),proj=dsc?coById(dsc.proj):null,rounds=STATE[m.id].rounds;
  if(!rounds.length)return `<div class="clhead"><div class="t">${L('Modelo ainda não publicado — sem histórico de rounds.','Model not published yet — no round history.')}</div></div>`;
  const last=rounds[rounds.length-1],prev=rounds[rounds.length-2],delta=prev?last.appr-prev.appr:0;
  const info=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-bottom:16px">
    <div class="metric"><div class="lb">${L('Projetista','Designer')}</div><div class="vl" style="font-size:15px">${proj?esc(proj.name):esc(m.co)}</div></div>
    <div class="metric"><div class="lb">${L('Disciplina','Discipline')}</div><div class="vl" style="font-size:15px">${m.disc}-${m.sub}</div></div>
    <div class="metric"><div class="lb">${L('Versão atual','Current version')}</div><div class="vl" style="font-size:15px">${m.ver}</div></div>
    <div class="metric"><div class="lb">Rounds</div><div class="vl">${rounds.length}</div></div></div>`;
  const deltacards=`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0">
    <div class="metric"><div class="lb">${L('Itens atendidos','Items met')}</div><div class="vl" style="color:var(--ok)">+${last.met}</div></div>
    <div class="metric"><div class="lb">${L('Superado','Exceeded')}</div><div class="vl" style="color:var(--accent)">${last.exc}</div></div>
    <div class="metric"><div class="lb">${L('Novos problemas','New issues')}</div><div class="vl" style="color:var(--bad)">${last.neu}</div></div></div>`;
  const rows=rounds.slice().reverse().map(r=>`<tr><td style="font-family:var(--mono);font-weight:600">R${r.r}</td><td class="ver">${r.ver}</td><td class="co">${r.date}</td>
    <td><div class="appro"><div class="track"><div class="fill" style="width:${r.appr}%;background:${pctColor(r.appr)}"></div></div><span class="pctn" style="color:${pctColor(r.appr)}">${r.appr}%</span></div></td>
    <td style="text-align:right;font-size:12px"><span style="color:var(--ok)">+${r.met}</span> · <span style="color:var(--accent)">${r.exc}</span> · <span style="color:var(--bad)">${r.neu}</span></td></tr>`).join('');
  return `${info}
   <div class="clhead"><div class="t"><b>${L('Gráfico de avanço','Progress chart')}</b> — ${L('aprovação por round','approval per round')} ${prev?`(<span style="color:${delta>=0?'var(--ok)':'var(--bad)'}">${delta>=0?'+':''}${delta}% ${L('vs anterior','vs previous')}</span>)`:''}</div></div>
   <div class="card" style="padding:12px 10px 4px">${chartSVG(rounds)}</div>
   ${deltacards}
   <div class="clhead"><div class="t"><b>${L('Rodadas','Rounds')}</b></div><div class="t">${L('atendido · superado · novos','met · exceeded · new')}</div></div>
   <div class="card"><table><thead><tr><th>Round</th><th class="c">${L('Versão','Version')}</th><th>${L('Data','Date')}</th><th>${L('Aprovação','Approval')}</th><th style="text-align:right">Δ</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function barChart(data,pct){pct=pct!==false;const W=520,H=190,pad=30,top=18,base=H-24;const max=pct?100:Math.max(1,...data.map(d=>d.value));const n=Math.max(1,data.length);const slot=(W-pad-10)/n;
  const grid=(pct?[0,50,100]:[0,max]).map(v=>{const y=base-(base-top)*v/(pct?100:max);return `<line x1="${pad}" y1="${y}" x2="${W-6}" y2="${y}" stroke="var(--line)" stroke-width="0.5"/>`;}).join('');
  const bars=data.map((d,i)=>{const bw=Math.min(56,slot*0.55);const x=pad+i*slot+(slot-bw)/2;const h=(base-top)*(d.value/(pct?100:max));const y=base-h;
    return `<rect x="${x}" y="${y}" width="${bw}" height="${h}" rx="5" fill="${d.color||'var(--accent)'}"/>
      <text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink-2)" font-family="var(--mono)">${pct?d.value+'%':d.value}</text>
      <text x="${x+bw/2}" y="${base+16}" text-anchor="middle" font-size="11" fill="var(--ink-3)">${d.label}</text>`;}).join('');
  return `<svg width="100%" viewBox="0 0 ${W} ${H}">${grid}${bars}</svg>`;
}
function donut(data){const total=data.reduce((a,d)=>a+d.value,0)||1;const R=58,r=36,cx=68,cy=70;let ang=-Math.PI/2;
  const arcs=data.map(d=>{if(!d.value)return '';const frac=d.value/total,a2=ang+frac*2*Math.PI;
    const x1=cx+R*Math.cos(ang),y1=cy+R*Math.sin(ang),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    const xi2=cx+r*Math.cos(a2),yi2=cy+r*Math.sin(a2),xi1=cx+r*Math.cos(ang),yi1=cy+r*Math.sin(ang);
    const large=frac>0.5?1:0;ang=a2;
    return `<path d="M${x1} ${y1} A${R} ${R} 0 ${large} 1 ${x2} ${y2} L${xi2} ${yi2} A${r} ${r} 0 ${large} 0 ${xi1} ${yi1} Z" fill="${d.color}"/>`;}).join('');
  const legend=data.map(d=>`<div style="display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:7px"><span style="width:10px;height:10px;border-radius:3px;background:${d.color};flex:none"></span>${d.label}<b style="margin-left:auto;font-family:var(--mono)">${d.value}</b></div>`).join('');
  return `<div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap"><svg width="140" height="140" viewBox="0 0 140 140" style="flex:none">${arcs}<text x="68" y="70" text-anchor="middle" dominant-baseline="central" font-size="20" font-weight="700" fill="var(--ink)" font-family="var(--mono)">${total}</text></svg><div style="min-width:150px;flex:1">${legend}</div></div>`;
}

  const medal=i=>i===0?'🥇':i===1?'🥈':i===2?'🥉':`<span style="color:var(--ink-3);font-family:var(--mono);font-size:12px">${i+1}</span>`;

  const scorecard=`<div class="sectitle" style="margin-top:22px">${L('Placar de conformidade por fornecedor','Supplier compliance scorecard')}</div>
    <div class="card"><table><thead><tr><th class="c">#</th><th>${L('Fornecedor','Supplier')}</th><th>${L('Aprovação média','Avg approval')}</th><th class="c">${L('RNCs','NCRs')}</th><th class="c">${L('Penalid.','Penalt.')}</th><th style="text-align:right">${L('Índice','Index')}</th></tr></thead><tbody>${scoreRows}</tbody></table></div>
    <p class="hint">${L('Índice = aprovação média, descontando penalidades de nomenclatura e não-conformidades abertas.','Index = average approval, minus nomenclature penalties and open non-conformities.')}</p>`;
  return `<div class="top"><div><h1>${L('KPIs','KPIs')}</h1><div class="sub">${L('Visão executiva do programa de auditoria do CPQ11.','Executive view of the CPQ11 audit program.')}</div></div><button class="btn" onclick="exportExcel()">↓ ${L('Exportar','Export')}</button></div>

let NOM_PATTERN=[{k:'PROJETO',vals:'CPQ11'},{k:'MACRO',vals:'A,C,M,S'},{k:'DISC',vals:'ARCH,STRC,FPRT,FALM,SCTY,MEP'},{k:'SUB',vals:''},{k:'SETOR',vals:'ADMIN,COLO1,COLO2,COLO3,SITE,UTLS,DATA,GUAR'},{k:'SW',vals:'R22,R24,RX3'}];
let nomTest='CPQ11-C-STRC-CONCR-ADMIN-R22';let nomResult=null;let nomResp='c3';
function validateName(name){const parts=(name||'').trim().split('-');
  const segs=NOM_PATTERN.map((s,i)=>{const val=parts[i];const allow=s.vals.split(',').map(x=>x.trim()).filter(Boolean);return {k:s.k,val:val==null?'':val,ok:val!=null&&val!==''&&(allow.length===0||allow.includes(val))};});
  return {ok:parts.length===NOM_PATTERN.length&&segs.every(s=>s.ok),countOk:parts.length===NOM_PATTERN.length,segs};
}
function runNomValidate(){const r=validateName(nomTest);nomResult=r;
  if(!r.ok){const co=coById(nomResp);if(co)co.pen=(co.pen||0)+1;
    pushNotif('penalty',L('Nomenclatura divergente: ','Divergent nomenclature: ')+nomTest+(co?(' · +1 '+L('penalidade · ','penalty · ')+co.name):''),co?co.name:'');
    toast(L('Divergência — penalidade aplicada e notificação enviada','Divergence — penalty applied and notification sent'));

  render();
}

function newModel(){const d=DISCIPLINES[0];modelDraft={discCode:d.code,setor:'DATA',code:'',bim:'',ver:'V1',st:'np',co:''};modelPickDisc(d.code);}
function modelPickDisc(code){const dsc=DISCIPLINES.find(x=>x.code===code);modelDraft.discCode=code;const proj=dsc?coById(dsc.proj):null;modelDraft.co=proj?proj.name:'';modelDraft.bim=proj?proj.name:'';modelSyncCode();render();}
function modelSyncCode(){const dsc=DISCIPLINES.find(x=>x.code===modelDraft.discCode);if(dsc)modelDraft.code=`${PROJECT.code}-${dsc.disc}-${dsc.sub}-${modelDraft.setor||'DATA'}`;}
function initModelState(m){const st={status:{},notes:{},ncs:[],areas:{},rounds:[]};
  Object.keys(CHECKLISTS).forEach(key=>{st.status[key]={};st.notes[key]={};CHECKLISTS[key].ids.forEach(cid=>{st.status[key][cid]='wait';});});
  const dsc=discOf(m);const areas=dsc?dsc.areas:[];AREAS.forEach(([a])=>{st.areas[a]=areas.includes(a)?'np':'na';});
  STATE[m.id]=st;}
function saveModel(){const d=modelDraft;const dsc=DISCIPLINES.find(x=>x.code===d.discCode);
  if(!dsc){toast(L('Selecione uma disciplina','Select a discipline'));return;}
  if(!d.code){toast(L('Informe o código do modelo','Enter the model code'));return;}
  if(MODELS.some(m=>m.code===d.code)){toast(L('Já existe um modelo com esse código','A model with this code already exists'));return;}
  const id=MODEL_SEQ++;
  const m={id,code:d.code,macro:dsc.macro,disc:dsc.disc,sub:dsc.sub,co:d.co||(coById(dsc.proj)||{}).name||'',bim:d.bim||d.co||'',ver:d.ver||'V1',st:d.st||'np'};
  MODELS.push(m);initModelState(m);modelDraft=null;
  pushNotif('audit',L('Novo modelo cadastrado — ','New model registered — ')+m.code,m.co);
  toast(L('Modelo criado ✓','Model created ✓'));render();
}
function modelEditor(){const d=modelDraft;
  const dOpts=DISCIPLINES.map(x=>`<option value="${x.code}" ${d.discCode===x.code?'selected':''}>${x.code} · ${MACRO[x.macro]?MACRO[x.macro].t:x.macro}</option>`).join('');
  const dsc=DISCIPLINES.find(x=>x.code===d.discCode);const proj=dsc?coById(dsc.proj):null;
  const coOpts=COMPANIES.filter(c=>c.roles.includes('trade')||c.roles.includes('bim')).map(c=>`<option value="${esc(c.name)}" ${d.co===c.name?'selected':''}>${esc(c.name)}</option>`).join('');
  return `<div class="editor"><h3>${L('Novo modelo','New model')}</h3>
    <div class="frow">
      <div><label class="fl">${L('Disciplina','Discipline')}</label><select class="f" onchange="modelPickDisc(this.value)">${dOpts}</select></div>
      <div><label class="fl">${L('Setor / sufixo','Sector / suffix')}</label><input class="f" value="${esc(d.setor)}" oninput="modelDraft.setor=this.value.toUpperCase();modelSyncCode();var e=document.getElementById('mcode');if(e)e.value=modelDraft.code" placeholder="DATA / SITE"></div>
      <div class="full"><label class="fl">${L('Código do modelo','Model code')}</label><input id="mcode" class="f" value="${esc(d.code)}" oninput="modelDraft.code=this.value" style="font-family:var(--mono)"></div>
      <div><label class="fl">${L('Instaladora','Installer')}</label><select class="f" onchange="modelDraft.co=this.value">${coOpts}</select></div>
      <div><label class="fl">${L('Modelagem (autoria)','Modeling (authoring)')}</label><input class="f" value="${esc(d.bim)}" oninput="modelDraft.bim=this.value"></div>
      <div><label class="fl">${L('Versão inicial','Initial version')}</label><input class="f" value="${esc(d.ver)}" oninput="modelDraft.ver=this.value"></div>
      <div><label class="fl">Status</label><select class="f" onchange="modelDraft.st=this.value"><option value="np" ${d.st==='np'?'selected':''}>${L('Não publicado','Not published')}</option><option value="pub" ${d.st==='pub'?'selected':''}>${L('Publicado','Published')}</option></select></div>
    </div>
    <div style="background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:12px;font-size:12.5px;color:var(--ink-2);line-height:1.7">
      <b>${L('Herdado da disciplina','Inherited from discipline')} ${dsc?dsc.code:''}</b><br>
      ${L('Projetista','Designer')}: <b>${proj?esc(proj.name):'—'}</b> · ${L('Auditorias','Audits')}: <b>${dsc?dsc.cls.map(k=>TAB_LABEL()[k]).join(', '):'—'}</b><br>
      ${L('Áreas','Areas')}: <b>${dsc?(dsc.areas.join(', ')||'—'):'—'}</b> · ${L('Nomenclatura','Nomenclature')}: <b>${dsc&&stdById(dsc.nom)?esc(stdById(dsc.nom).name):'—'}</b>
    </div>
    <div class="eact"><button class="btn pri" onclick="saveModel()">${L('Criar modelo','Create model')}</button><button class="btn" onclick="modelDraft=null;render()">${L('Cancelar','Cancel')}</button></div></div>`;
}

function render(){const el=document.getElementById('main');
  if(view.name==='home')el.innerHTML=homeView();
  else if(view.name==='model')el.innerHTML=modelView();
  else if(view.name==='cfg')el.innerHTML=cadastroView();
  else if(view.name==='notif')el.innerHTML=notifView();
  else if(view.name==='kpis')el.innerHTML=kpisView();
  else if(view.name==='integ')el.innerHTML=integView();
  else if(view.name==='issues')el.innerHTML=issuesView();
  else if(view.name==='client')el.innerHTML=clientView();
  else if(view.name==='peb')el.innerHTML=pebView();
  else if(view.name==='lib')el.innerHTML=libView();
  else if(view.name==='rep')el.innerHTML=repView();
}
let AUTH=null;
function loadAuth(){try{const id=localStorage.getItem('cpq_auth');if(id){const u=userById(id);if(u&&u.status!=='inativo')return u;}}catch(e){}return null;}
function loginScreen(){
  return `<div class="logincard">
    <div class="loginlogo">SPBIM</div>
    <div class="logintitle">${L('Central de Auditoria BIM','BIM Audit Center')}</div>
    <div class="loginsub">${L('Entre para acessar o projeto CPQ11','Sign in to access project CPQ11')}</div>
    <label>${L('E-mail','Email')}</label><input id="loginEmail" class="f" placeholder="voce@spbim.com.br" onkeydown="if(event.key==='Enter')document.getElementById('loginPass').focus()">
    <label style="margin-top:12px">${L('Senha','Password')}</label><input id="loginPass" type="password" class="f" placeholder="••••" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn pri" style="width:100%;margin-top:18px;padding:10px 0" onclick="doLogin()">${L('Entrar','Sign in')}</button>
    <div id="loginErr" style="color:var(--bad);font-size:12.5px;margin-top:10px;min-height:16px"></div>
    <div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-3);line-height:1.7">${L('Contas de teste','Test accounts')}:<br>${L('Admin','Admin')}: <b style="font-family:var(--mono)">julio@spbim.com.br</b> / <b style="font-family:var(--mono)">1234</b><br>${L('Cliente','Client')}: <b style="font-family:var(--mono)">cliente@microsoft.com</b> / <b style="font-family:var(--mono)">1234</b><br>${L('Protótipo — autenticação ilustrativa (sem senha real/hash).','Prototype — illustrative auth only (no real password/hash).')}</div>
  </div>`;
}
function doLogin(){const email=(document.getElementById('loginEmail').value||'').trim().toLowerCase();const pass=document.getElementById('loginPass').value||'';
  const u=USERS.find(x=>x.login.toLowerCase()===email&&x.senha===pass&&x.status!=='inativo');
  if(u){AUTH=u;try{localStorage.setItem('cpq_auth',u.id);}catch(e){}boot();}
  else{const m=document.getElementById('loginErr');if(m)m.textContent=L('E-mail ou senha inválidos.','Invalid email or password.');}
}
function logout(){AUTH=null;CURPROJ=null;try{localStorage.removeItem('cpq_auth');}catch(e){}view={name:'home'};boot();}
function selectProject(id){CURPROJ=id;MODELS=PROJMODELS[id];PROJECT=PROJECTS.find(p=>p.id===id);view={name:'home'};repModel=null;modelDraft=null;auditSel={};boot();}
function selectClient(id){pickedClient=id;pickerStep='project';boot();}
function backToClients(){pickerStep='client';pickedClient=null;boot();}
function changeProject(){CURPROJ=null;pickerStep='client';pickedClient=null;boot();}
function projCard(p){const mods=PROJMODELS[p.id]||[];const aps=mods.map(modelPct).filter(x=>x!=null);const avg=aps.length?Math.round(aps.reduce((a,b)=>a+b,0)/aps.length):0;
  const badge=p.status==='ativo'?`<span class="pill pub"><span class="dot"></span>${L('Ativo','Active')}</span>`:p.status==='piloto'?`<span class="pill out">${L('Piloto','Pilot')}</span>`:`<span class="pill np">${L('Em configuração','In setup')}</span>`;
  return `<button onclick="selectProject('${p.id}')" style="text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;display:flex;flex-direction:column;gap:11px;box-shadow:0 1px 2px rgba(23,27,34,.05)" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--line)'">
    <div style="display:flex;align-items:center;justify-content:space-between"><span style="font-family:var(--mono);font-weight:700;font-size:15px">${p.code}</span>${badge}</div>
    <div style="font-size:14px;font-weight:600">${esc(p.name)}</div>
    <div style="display:flex;gap:20px;margin-top:4px"><div><div style="font-size:11px;color:var(--ink-3)">${L('Modelos','Models')}</div><div style="font-weight:700;font-family:var(--mono)">${mods.length}</div></div><div><div style="font-size:11px;color:var(--ink-3)">${L('Aprovação','Approval')}</div><div style="font-weight:700;font-family:var(--mono);color:${pctColor(avg)}">${mods.length?avg+'%':'—'}</div></div></div></button>`;
}
function pickerScreen(){
  const head=(title,sub,logo)=>`<div style="text-align:center;margin-bottom:6px"><span style="font-weight:800;letter-spacing:2px;font-size:22px;color:var(--accent)">SPBIM</span></div>
    ${logo?`<div style="display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:4px">${logo}<span style="font-size:20px;font-weight:700">${title}</span></div>`:`<div style="text-align:center;font-size:20px;font-weight:700">${title}</div>`}
    <div style="text-align:center;font-size:13px;color:var(--ink-2);margin-bottom:28px">${sub}</div>`;
  if(pickerStep==='project'&&pickedClient){
    const cl=CLIENTS.find(c=>c.id===pickedClient);const projs=PROJECTS.filter(p=>p.clientId===pickedClient);
    const cards=projs.map(projCard).join('')||`<div class="empty">${L('Sem projetos para este cliente.','No projects for this client.')}</div>`;
    return `<div style="max-width:900px;margin:0 auto;padding:64px 24px">
       ${head(esc(cl.name),L('Selecione o projeto','Select the project'),coLogo({name:cl.name},34))}
       <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px">${cards}</div>
       <div style="text-align:center;margin-top:26px"><button class="btn" onclick="backToClients()">← ${L('Trocar cliente','Switch client')}</button></div></div>`;
  }
  const cards=CLIENTS.map(c=>{const n=PROJECTS.filter(p=>p.clientId===c.id).length;
    return `<button onclick="selectClient('${c.id}')" style="text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;cursor:pointer;display:flex;align-items:center;gap:14px;box-shadow:0 1px 2px rgba(23,27,34,.05)" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--line)'">
      ${coLogo({name:c.name},42)}<div style="flex:1"><div style="font-size:15px;font-weight:600">${esc(c.name)}</div><div style="font-size:12.5px;color:var(--ink-3)">${n} ${L('projeto(s)','project(s)')}</div></div>
      <span style="color:var(--ink-3);font-size:18px">›</span></button>`;}).join('');
  return `<div style="max-width:900px;margin:0 auto;padding:64px 24px">
     ${head(L('Selecione um cliente','Select a client'),(AUTH?esc(AUTH.nome)+' · ':'')+L('escolha o cliente para acessar os projetos','choose the client to access its projects'),'')}
     <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px">${cards}</div>
     <div style="text-align:center;margin-top:28px"><button class="btn" onclick="logout()">${L('Sair','Log out')}</button></div></div>`;
}
function boot(){
  document.documentElement.lang=LANG==='pt'?'pt-BR':'en';
  applyTheme();
  const app=document.querySelector('.app'),login=document.getElementById('login'),capp=document.getElementById('clientapp'),pick=document.getElementById('picker');
  const hideAll=()=>{app.style.display='none';capp.style.display='none';pick.style.display='none';login.style.display='none';};
  const mb0=document.getElementById('mobilebar');
  if(!AUTH){hideAll();login.style.display='flex';login.innerHTML=loginScreen();if(mb0)mb0.style.display='none';const e=document.getElementById('loginEmail');if(e)e.focus();return;}
  if(AUTH.papel==='cliente'){CURPROJ='cpq11';MODELS=PROJMODELS.cpq11;PROJECT=PROJECTS[0];hideAll();capp.style.display='block';capp.innerHTML=clientShell();if(mb0)mb0.style.display='none';return;}
  if(!CURPROJ){hideAll();pick.style.display='block';pick.innerHTML=pickerScreen();if(mb0)mb0.style.display='none';return;}
  hideAll();app.style.display='grid';if(mb0)mb0.style.display='';
  navRender();render();
}
AUTH=loadAuth();
boot();
</script>
</body>
