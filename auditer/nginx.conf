server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão. Os dicionários (.dic/.aff, ~5,5 MB) são texto e comprimem muito
    # bem (pt_BR.dic: 4,5 MB -> ~1,3 MB). Também comprime JS/CSS/WASM/SVG.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/wasm application/octet-stream image/svg+xml;

    # Assets com hash no nome (index-XXXX.js/.css) -> cache longo e imutável.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Dicionários: não mudam entre builds, cache longo.
    location /dictionaries/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # index.html nunca em cache -> após um redeploy o app novo aparece na hora.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA: com BrowserRouter, uma rota como /padroes precisa cair no index.html
    # em vez de 404 ao recarregar a página.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
